<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090E" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Conceptual OBGYN — Offline Revision Vault</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 120% at 12% 8%, rgba(13, 148, 136, 0.24), transparent 55%),
          radial-gradient(100% 100% at 88% 12%, rgba(79, 70, 229, 0.22), transparent 58%),
          #07090e;
        font-family: Inter, system-ui, sans-serif;
        color: #e6f1f5;
      }
      .card {
        max-width: 30rem;
        margin: 2rem;
        padding: 2.25rem;
        border-radius: 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(28px) saturate(150%);
        text-align: center;
      }
      .logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.25rem;
      }
      .logo-img {
        width: 72px;
        height: auto;
        filter: drop-shadow(0 8px 16px rgba(8, 145, 178, 0.28));
      }
      h1 {
        font-family: 'Plus Jakarta Sans', Inter, sans-serif;
        letter-spacing: -0.03em;
        font-size: 1.35rem;
        margin: 0 0 0.6rem;
      }
      p {
        margin: 0.35rem 0;
        font-size: 0.9rem;
        line-height: 1.6;
        color: rgba(226, 232, 240, 0.72);
      }
      code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        color: #5eead4;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.25rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(20, 184, 166, 0.18);
        color: #f0fdfa;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo-container">
        <img class="logo-img" src="/brand/logo.png" alt="Conceptual OBGYN Logo" width="72" height="49" />
      </div>
      <h1>You are offline — your vault is still open</h1>
      <p>
        Conceptual OBGYN served this shell from the device cache. Previously visited revision modules, flashcards and
        clinical pearls remain readable without a connection.
      </p>
      <p><code>workbox-runtime-caching · obgyn-revision-modules-v1</code></p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
