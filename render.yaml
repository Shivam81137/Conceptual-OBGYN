services:
  - type: web
    name: conceptual-obgyn-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @conceptual-obgyn/server
    startCommand: npm run start --workspace @conceptual-obgyn/server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_UPLOAD_MAX_BYTES
        value: 10485760

